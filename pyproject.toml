[project]
name = "s2t"
version = "0.1.0"
description = "Speech-to-text notebook workflow using OpenAI audio models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.5.0",
  "ffmpeg-python>=0.2.0",
  "python-docx>=1.1.0",
  "tqdm>=4.66.0",
  "jupyterlab>=4.1.0",
  "ipykernel>=6.29.0",
]

[tool.uv]
dev-dependencies = ["ruff>=0.6", "mypy>=1.10"]
